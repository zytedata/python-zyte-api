[tox]
min_version = 4.25.0
requires =
    sphinx-scrapy[tox]==0.13.0
envlist = pre-commit,mypy,min,min-x402,py3{11-15},x402,docs,twine

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-cov >= 7.0.0
    pytest-rerunfailures
    pytest-twisted
    responses
    twisted
commands =
    pytest \
        --cov-report=term-missing --cov-report=html --cov-report=xml --cov=zyte_api \
        --doctest-modules \
        {posargs:zyte_api tests}

[testenv:x402]
extras = x402

[min]
deps =
    {[testenv]deps}
    aiohttp==3.8.2
    attrs==20.1.0
    brotli==0.5.2
    runstats==0.0.1
    tenacity==8.2.0
    tqdm==4.16.0
    w3lib==2.1.1

[testenv:min]
basepython = python3.11
deps =
    {[min]deps}
    typing-extensions==4.5.0

[testenv:min-x402]
basepython = python3.11
deps =
    {[min]deps}
    eth_account==0.13.7
    # x402 pulls in pydantic, which requires a newer typing-extensions.
    typing-extensions==4.12.2
    x402==0.1.1

[testenv:mypy]
deps =
    mypy==2.4.0
    eth-account==0.14.0
    pytest==9.1.1
    Twisted==26.4.0
    types-tqdm==4.70.0.20260906
    x402==1.0.0

commands = mypy \
    zyte_api \
    tests

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:twine]
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*
